  <text x="78" y="34" font-family="Sora, Arial, sans-serif" font-weight="700" font-size="25" fill="#0C2D4E">Talent<tspan fill="#1FAE93">'up</tspan></text>
  <text x="228" y="27" font-family="Sora, Arial, sans-serif" font-weight="700" font-size="13" fill="#D9A441" letter-spacing="0.5">SN</text>
  <text x="78" y="54" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="11" letter-spacing="1.5" fill="#56606E">TROUVE TON STAGE</text>

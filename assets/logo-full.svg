  <path d="M32.5 15.5 L39.5 15.5 L39.5 22.5" fill="none" stroke="#F5F7FA" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Etoile : le talent qui se distingue -->
  <path d="M49.5 9 L51.2 13.2 L55.7 13.5 L52.2 16.3 L53.4 20.7 L49.5 18.2 L45.6 20.7 L46.8 16.3 L43.3 13.5 L47.8 13.2 Z"

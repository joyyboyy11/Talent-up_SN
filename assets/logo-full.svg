<svg width="300" height="72" viewBox="0 0 300 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Talent'up SN">
  <defs>
    <linearGradient id="tuGradFull" x1="12" y1="48" x2="46" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#1FAE93"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0C2D4E"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#163C63" stroke-width="1"/>

  <!-- Barres ascendantes : progression / montee en competences -->
  <rect x="14" y="36" width="7.5" height="14" rx="2" fill="#E9BE6C"/>
  <rect x="25.5" y="28" width="7.5" height="22" rx="2" fill="url(#tuGradFull)"/>
  <rect x="37" y="20" width="7.5" height="30" rx="2" fill="#1FAE93"/>

  <!-- Fleche de tendance vers le haut -->
  <path d="M15 33 L27 24 L38.5 16" fill="none" stroke="#F5F7FA" stroke-width="2.2"
